# rbitcoin stderr / log line → Core debug.log substring(s).
# match is a regex (case-sensitive). emit may use {1}, {2}, … captures.
# Applied by the bitcoind shim. Operator logs stay native; this file is the
# only Core debug.log dialect. Unmapped strings stay skip reason core-log.

[[rule]]
match = 'p2p: trying connection \(([^)]+)\) to (.+)$'
emit = ['trying v1 connection ({1}) to {2}']

[[rule]]
match = 'rpc: listening on 127\.0\.0\.1:(\d+)'
emit = ['Bound to 127.0.0.1:{1}']

[[rule]]
match = 'rbitcoin-node listening on (\S+)'
emit = ['Bound to {1}']

[[rule]]
match = 'p2p: getblocktxn with out-of-bounds tx indices'
emit = ['getblocktxn with out-of-bounds tx indices']

[[rule]]
match = 'p2p: previous compact block reconstruction attempt failed'
emit = ['previous compact block reconstruction attempt failed']

[[rule]]
match = 'p2p: ignore low-work compact block from peer (\d+)'
emit = ['[net] Ignoring low-work compact block from peer {1}']

[[rule]]
match = 'Block validation error: (.+)'
emit = ['Block validation error: {1}']

# Pre-segwit witness block. The node already rejects with this sentence.
[[rule]]
match = 'unexpected witness before segwit'
emit = ['unexpected-witness']

# Empty v0 witness program. The node already rejects; Core's script error
# text is the needle p2p_segwit.py reads.
[[rule]]
match = 'block-script-verify-flag-failed \(p2wsh empty witness\)'
emit = ['block-script-verify-flag-failed (Witness program was passed an empty witness)']

[[rule]]
match = '([0-9a-f]{64}), bad-version\(0x([0-9a-f]{8})\)'
emit = ['{1}, bad-version(0x{2})']

[[rule]]
match = 'p2p: pong peer=(\d+): (.+)$'
emit = ['pong peer={1}: {2}']

[[rule]]
match = 'p2p: ping timeout: ([0-9.]+)s'
emit = ['ping timeout: {1}s']

[[rule]]
match = 'p2p: local tx ([0-9a-f]{64}) left the unbroadcast set before a peer fetched it'
emit = ['Removed {1} from set of unbroadcast txns before confirmation that txn was sent out']

[[rule]]
match = 'p2p: v2 peer sent a message type we do not know'
emit = ['V2 transport error: invalid message type']

[[rule]]
match = 'p2p: v2 packet is longer than the cap \((\d+) bytes\)'
emit = ['V2 transport error: packet too large ({1} bytes)']

[[rule]]
match = 'p2p: redundant version message from peer(=.*)?'
emit = ['redundant version message from peer']

[[rule]]
match = 'p2p: v2 handshake timed out, disconnecting peer=(\d+)'
emit = ['V2 handshake timeout, disconnecting peer={1}']

[[rule]]
match = 'p2p: v2 handshake had no garbage terminator'
emit = ['V2 transport error: missing garbage terminator']

[[rule]]
match = 'p2p: v2 packet did not decrypt'
emit = ['V2 transport error: packet decryption failure']

[[rule]]
match = 'p2p: sendaddrv2 received after verack, disconnecting peer=(\d+)'
emit = ['sendaddrv2 received after verack, disconnecting peer={1}']

[[rule]]
match = 'p2p: addrv2 message size = (\d+)'
emit = ['addrv2 message size = {1}']

[[rule]]
match = 'p2p: received: addrv2 \((\d+) bytes\) peer=(\d+)'
emit = ['received: addrv2 ({1} bytes) peer={2}']

[[rule]]
match = 'p2p: sending addrv2 \((\d+) bytes\) peer=(\d+)'
emit = ['sending addrv2 ({1} bytes) peer={2}']

[[rule]]
match = 'p2p: header ([0-9a-f]{64}) missing pow proof — not stored'
emit = ['AcceptBlockHeader: not adding new block header {1}, missing anti-dos proof-of-work validation']

[[rule]]
match = 'p2p: accept dropped [0-9a-f]{64} \(prev not found\)'
emit = ['AcceptBlock FAILED (prev-blk-not-found)']

[[rule]]
match = 'p2p: ignore low-work headers height=(\d+)'
emit = ['[net] Ignoring low-work chain (height={1})']

[[rule]]
match = 'p2p: initial getheaders height=(\d+) peer=(\d+)'
emit = ['initial getheaders ({1}) to peer={2}']

[[rule]]
match = 'p2p: headers sync height=(\d+)'
emit = ['Synchronizing blockheaders, height: {1}']

[[rule]]
match = 'p2p: headers sync timeout, disconnect peer=(\d+)'
emit = ['Timeout downloading headers, disconnecting peer={1}']

[[rule]]
match = 'p2p: headers sync timeout, keep peer=(\d+)'
emit = ['Timeout downloading headers from noban peer, not disconnecting peer={1}']

[[rule]]
match = 'SetNetworkActive: (true|false)'
emit = ['SetNetworkActive: {1}']

[[rule]]
match = 'received: addr'
emit = ['received: addr']

[[rule]]
match = 'p2p: received tx'
emit = ['received: tx']

[[rule]]
match = 'txrelay: park '
emit = ['was not accepted', 'missingorspent']

[[rule]]
match = 'Error: peer-timeout must be a positive integer\.'
emit = ['Error: peertimeout must be a positive integer.']

[[rule]]
match = 'p2p: transaction sent in violation of protocol, disconnecting peer=(\d+)'
emit = ['transaction sent in violation of protocol, disconnecting peer={1}']

[[rule]]
match = 'p2p: transaction \(([0-9a-f]+)\) inv sent in violation of protocol, disconnecting peer'
emit = ['transaction ({1}) inv sent in violation of protocol, disconnecting peer']

[[rule]]
match = 'p2p: getdata wtx ([0-9a-f]+) peer'
emit = ['received getdata for: wtx {1} peer']

[[rule]]
match = 'tip: best=([0-9a-f]{64}) height=(\d+) version=(-?\d+) tx=(\d+) date=(\d+)'
emit = ['UpdateTip: new best={1} height={2} version={3} tx={4} date={5} progress=tip']

[[rule]]
match = 'Store tip time is more than two hours ahead of the node clock'
emit = ['The block database contains a block which appears to be from the future.']

[[rule]]
match = 'Cannot obtain a lock on directory (.+)\. rbitcoin is probably already running'
emit = ['Error: Cannot obtain a lock on directory {1}. Bitcoin Core is probably already running.']

[[rule]]
match = 'Cannot resolve --net-permission-bind address'
emit = ['Cannot resolve -whitebind address']

[[rule]]
match = 'Need to specify a port with --net-permission-bind'
emit = ['Need to specify a port with -whitebind']

[[rule]]
match = 'Invalid netmask specified in --net-permission'
emit = ['Invalid netmask specified in -whitelist']

[[rule]]
match = '--net-permission-bind may only be used for incoming connections'
emit = ['whitebind may only be used for incoming connections']

[[rule]]
match = 'p2p: Added connection peer=(\d+)'
emit = ['Added connection peer={1}']

[[rule]]
match = 'p2p: Unsupported message "([^"]+)" prior to verack from peer=(\d+)'
emit = ['Unsupported message "{1}" prior to verack from peer={2}']

[[rule]]
match = 'p2p: non-version message before version handshake. Message "([^"]+)" from peer=(\d+)'
emit = ['non-version message before version handshake. Message "{1}" from peer={2}']

[[rule]]
match = 'p2p: version handshake timeout, disconnecting peer=(\d+)'
emit = ['version handshake timeout, disconnecting peer={1}']

[[rule]]
match = 'p2p: Force relaying tx ([0-9a-f]+) \(wtxid=([0-9a-f]+)\) from peer=(\d+)'
emit = ['Force relaying tx {1} (wtxid={2}) from peer={3}']

[[rule]]
match = 'p2p: Not relaying non-mempool transaction ([0-9a-f]+) \(wtxid=([0-9a-f]+)\) from forcerelay peer=(\d+)'
emit = ['Not relaying non-mempool transaction {1} (wtxid={2}) from forcerelay peer={3}']

[[rule]]
match = 'mempool: rolling minimum fee bumped'
emit = ['rolling minimum fee bumped']

[[rule]]
match = 'p2p: using obsolete version (\d+), disconnecting peer=(\d+)'
emit = ['using obsolete version {1}, disconnecting peer={2}']
