name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

# Pin rustc to the nix-shell / crane baseline so fmt/clippy do not drift with
# every GitHub Actions “stable” bump. Bump intentionally with the toolchain.
#
# Jobs are split so each gate is its own required check on the PR/push UI:
#   fmt → clippy → test → coverage (coverage waits for the three gates).
# fmt/clippy/test run in parallel; coverage only starts when all three pass.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
          workspaces: ". -> target/dev"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Keep uninstrumented artifacts out of the coverage tree (and vice versa).
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
      - name: build bins
        run: cargo build -p rbitcoin-node -p rbitcoin-cli
      - name: cargo test
        run: cargo test --workspace

  # Line-coverage gate (≥90% first-party LCOV LH/LF). Slow; waits for the
  # fast gates so a red fmt/clippy/test does not start this job. Required.
  coverage:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    env:
      # coverage.sh also forces target/cov; set here so rust-cache keys match.
      CARGO_TARGET_DIR: target/cov
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-coverage
          workspaces: ". -> target/cov"
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.14
      - name: coverage (line gate)
        run: ./scripts/coverage.sh
