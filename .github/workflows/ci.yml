name: ci

on:
  push:
    branches: [master, main, "v*.*.x"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Actions only. rust-cache restores dep rlibs (not workspace crates) and
  # strips incremental artifacts before persist; it also sets this so rustc
  # does not write throwaway dep-graphs.
  CARGO_INCREMENTAL: "0"

# Timing probe. Do not merge.
# qc, windows, macos, pread, and coverage are absent so they do not start.
# `test` is the current suite. `nextest` is the same suite under cargo-nextest.
# Both restore the shared dep cache and do not save it.
# `test` leaves RBITCOIN_IO unset, so Linux stays on io_uring.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep uninstrumented artifacts out of the coverage tree (and vice versa).
      CARGO_TARGET_DIR: target/dev
      # Test binaries get a private TMPDIR on /dev/shm (TESTING.md).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/tmpfs-test-runner.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 1.95.0 branch tip. a5f673d0 still says toolchain 1.95.0 but is no
      # longer on that branch, so zizmor reports a new use as an impostor.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
          save-if: "false"
      - name: tmpfs headroom
        run: df -h /dev/shm && free -m
      - name: cargo test
        run: cargo test --workspace --exclude rbitcoin-bench
      # The workspace exclude stays (coverage.test.sh). This one lib test is
      # the address-corpus pin: sha256::Hash Display is internal order.
      - name: bench scripthash pin
        run: cargo test -p rbitcoin-bench --lib hot_corpus_includes_p2a -- --quiet

  # Same suite, one shared test slot per logical CPU across binaries.
  # Default nextest test-threads is num-cpus. No per-binary thread pool.
  nextest:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/dev
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/tmpfs-test-runner.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.149
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
          save-if: "false"
      - name: tmpfs headroom
        run: df -h /dev/shm && free -m
      # --no-fail-fast: one timing assert must not cancel the rest of the
      # suite, or the step duration is not a full run.
      - name: cargo nextest
        run: cargo nextest run --workspace --exclude rbitcoin-bench --no-fail-fast
      - name: bench scripthash pin
        run: cargo nextest run -p rbitcoin-bench --lib hot_corpus_includes_p2a
