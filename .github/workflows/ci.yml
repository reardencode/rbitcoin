name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

# Pin rustc to the nix-shell / crane baseline so fmt/clippy do not drift with
# every GitHub Actions “stable” bump. Bump intentionally with the toolchain.
#
# Jobs are split so each gate is its own required check on the PR/push UI:
#   fmt + deny + clippy + ast-grep + test + windows + macos in parallel;
#   coverage / multinode wait for fmt/clippy/test.
# Operator binaries are GitHub Releases (release.yml), not this workflow.
#
# GitHub App often cannot push this file; operator `git push` if the branch
# includes workflow YAML.
jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      # Prebuilt cargo-deny — do not cargo install. Pin Action commit (CodeQL).
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          # 0.18.x cannot parse rustsec CVSS 4.0 advisories (2026).
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0 # nixpkgs/crane rustc pin — not Dependabot
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Structural lints (Q-51). fmt-class: no rustc. Required.
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not in taiki-e TOOLS.md; install-action falls back to cargo-binstall
      # (GitHub Release prebuilt). Do not cargo install.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: ast-grep@0.45.1
      - name: ast-grep fixture self-test
        env:
          CI: "true"
        run: ./scripts/ast-grep.test.sh
      - name: ast-grep scan crates
        run: ./scripts/ast-grep.sh

  clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-clippy
          workspaces: ". -> target/dev"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep uninstrumented artifacts out of the coverage tree (and vice versa).
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
      - name: build bins
        run: cargo build -p rbitcoin-node -p rbitcoin-cli
      - name: stage-musl-artifacts self-test
        run: ./scripts/stage-musl-artifacts.test.sh
      - name: stage-native-artifacts self-test
        run: ./scripts/stage-native-artifacts.test.sh
      - name: fuzz-run self-test
        run: ./scripts/fuzz-run.test.sh
      - name: release-pin self-test
        run: ./scripts/core-functional/release_pin.test.sh
      - name: fetch-bitcoind self-test
        run: ./scripts/core-functional/fetch-bitcoind.test.sh
      - name: miri-run self-test
        run: ./scripts/miri.test.sh
      - name: coverage-crap self-test
        run: ./scripts/coverage-crap.test.sh
      - name: release self-test
        run: ./scripts/release.test.sh
      - name: os-smoke self-test
        run: ./scripts/ci-os-smoke.test.sh
      - name: cargo test
        run: cargo test --workspace

  # Windows IOCP store + --smoke. Required. Not a CRT-static snapshot.
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Darwin pool IO + --smoke. Required. Not a notarized / operator zip.
  macos:
    name: macos
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-macos
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Multi-node IBD tier A (same cadence as coverage — every push/PR after gates).
  # Budget: ~2 min wall for 8-block + 10-block cold reconstruct paths.
  multinode:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-multinode
          workspaces: ". -> target/dev"
      - name: multi-node IBD (tier A)
        # One TESTNAME per `cargo test` invocation (second free arg is an error on
        # rustc 1.95+). Reconstruct / dead-peer are `#[ignore]` in the default
        # suite so llvm-cov does not re-pay them; pass `--ignored` here.
        run: |
          set -euo pipefail
          cargo test -p rbitcoin-test --test integration_multinode \
            two_node_header_and_block_sync -- --nocapture
          cargo test -p rbitcoin-test --test integration_multinode \
            serve_after_restart_via_reconstruct -- --ignored --nocapture
          cargo test -p rbitcoin-test --test integration_multinode \
            ibd_skips_dead_peer -- --ignored --nocapture
  # Line-coverage gate (≥90% first-party LCOV LH/LF). Slow; waits for the
  # fast gates so a red fmt/clippy/test does not start this job. Required.
  coverage:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    env:
      # coverage.sh also forces target/cov; set here so rust-cache keys match.
      CARGO_TARGET_DIR: target/cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-coverage
          workspaces: ". -> target/cov"
      # Prebuilt binary — do not `cargo install` (compiles llvm-cov from crates.io).
      # Pin commit (CodeQL: unpinned 3rd-party Action tags are not immutable).
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-crap@0.4.3
      - name: coverage (line gate)
        run: ./scripts/coverage.sh
