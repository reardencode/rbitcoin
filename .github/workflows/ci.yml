name: ci

on:
  push:
    branches: [master, main, "v*.*.x"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Actions only. rust-cache restores dep rlibs (not workspace crates) and
  # strips incremental artifacts before persist; it also sets this so rustc
  # does not write throwaway dep-graphs.
  CARGO_INCREMENTAL: "0"

# rustc comes from rust-toolchain.toml (the nix-shell / crane baseline), so
# fmt/clippy do not drift with GitHub Actions “stable”. The runner image's
# rustup auto-installs that toolchain and its components on first cargo.
#
# `qc` is one Ubuntu runner: fmt, ast-grep, unwrap-ratchet, hex-ratchet, deny, scripts, clippy, then
# nixos-module-eval. test, windows, and macos each have their own runner.
# coverage and pread wait for qc and test so a red test does not start them.
# pread is the Linux libc backend (`RBITCOIN_IO=pread`) for store and query.
# `test` leaves that variable unset, so Linux stays on io_uring.
# Mutants are not a PR check. Nightly workspace runs live in mutants.yml.
# nixos-module-runtime is a labeled job (nixos-module-runtime.yml), not this file.
# Operator binaries are GitHub Releases (release.yml), not this workflow.
#
# GitHub App often cannot push this file; operator `git push` if the branch
# includes workflow YAML.
jobs:
  # Quality checks on one runner, cheap steps first. A red fmt does not
  # install Nix or compile clippy. Check name is `qc`.
  qc:
    name: qc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # Not in taiki-e TOOLS.md; install-action falls back to cargo-binstall
      # (GitHub Release prebuilt). Do not cargo install.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ast-grep@0.45.1
      - name: ast-grep fixture self-test
        env:
          CI: "true"
        run: ./scripts/ast-grep.test.sh
      - name: ast-grep scan crates
        run: ./scripts/ast-grep.sh
      - name: unwrap ratchet self-test
        run: ./scripts/unwrap-ratchet.test.sh
      - name: unwrap ratchet
        run: ./scripts/unwrap-ratchet.sh
      - name: hex ratchet self-test
        run: ./scripts/hex-ratchet.test.sh
      - name: hex ratchet
        run: ./scripts/hex-ratchet.sh
      # Prebuilt cargo-deny — do not cargo install. Pin the action commit.
      # 0.18.x cannot parse rustsec CVSS 4.0 advisories (2026).
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check
      - name: contract-assert self-test
        run: ./scripts/contract-assert.test.sh
      - name: lightning script contracts
        run: ./scripts/lightning/run.test.sh
      - name: stage-musl-artifacts self-test
        run: ./scripts/stage-musl-artifacts.test.sh
      - name: stage-native-artifacts self-test
        run: ./scripts/stage-native-artifacts.test.sh
      - name: Dockerfile contract
        run: ./scripts/dockerfile.test.sh
      - name: docker-tags self-test
        run: ./scripts/docker-tags.test.sh
      - name: fuzz-run self-test
        run: ./scripts/fuzz-run.test.sh
      - name: release-pin self-test
        run: ./scripts/core-functional/release_pin.test.sh
      - name: fetch-bitcoind self-test
        run: ./scripts/core-functional/fetch-bitcoind.test.sh
      - name: miri-run self-test
        run: ./scripts/miri.test.sh
      - name: coverage self-test
        run: ./scripts/coverage.test.sh
      - name: coverage-crap self-test
        run: ./scripts/coverage-crap.test.sh
      - name: release self-test
        run: ./scripts/release.test.sh
      - name: release-gate
        run: ./scripts/release-gate.sh
      - name: os-smoke self-test
        run: ./scripts/ci-os-smoke.test.sh
      - name: pr-checks-watch self-test
        run: ./scripts/pr-checks-watch.test.sh
      - name: mutants queue self-test
        run: ./scripts/mutants-queue.test.sh
      - name: workflow concurrency self-test
        run: ./scripts/workflow-concurrency.test.sh
      - name: tmpfs test runner self-test
        run: ./scripts/tmpfs-test-runner.test.sh
      - name: overlay-functional runner self-test
        run: ./scripts/overlay-functional/run.sh.test.sh
      - name: journeys manifest
        run: ./scripts/journeys-manifest.test.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy
          workspaces: ". -> target/dev"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Both shapes TESTING.md names: workspace, and the product set that
      # nix/rbitcoin.nix and release.yml build (consensus without `corpus`).
      - name: cargo check --release
        run: |
          cargo check --release --workspace
          cargo check --release -p rbitcoin-node -p rbitcoin-cli -p rbitcoin-store
      # doc(hidden) pub modules are rustdoc-visible; a broken link is an error.
      - name: cargo doc
        run: cargo doc --workspace --no-deps
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nixos-module-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nixos-module-eval-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - name: Evaluate NixOS module
        run: timeout 2m nix build .#checks.x86_64-linux.nixos-module-eval --no-link

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep uninstrumented artifacts out of the coverage tree (and vice versa).
      CARGO_TARGET_DIR: target/dev
      # Test binaries get a private TMPDIR on /dev/shm (TESTING.md).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/tmpfs-test-runner.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test
          workspaces: ". -> target/dev"
      - name: tmpfs headroom
        run: df -h /dev/shm && free -m
      - name: cargo test
        run: cargo test --workspace --exclude rbitcoin-bench
      # The workspace exclude stays (coverage.test.sh). This one lib test is
      # the address-corpus pin: sha256::Hash Display is internal order.
      - name: bench scripthash pin
        run: cargo test -p rbitcoin-bench --lib hot_corpus_includes_p2a -- --quiet

  # Windows IOCP store + mmap fuse + query confirm + --smoke. Required. Not a CRT-static snapshot.
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-windows
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Darwin pool IO + mmap fuse + query confirm + --smoke. Required. Not a notarized / operator zip.
  macos:
    name: macos
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_HEAD_SCALE: tiny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-macos-26
          workspaces: ". -> target/dev"
      - name: store + node smoke
        run: ./scripts/ci-os-smoke.sh

  # Linux libc pread. Same wait as coverage: a red `test` does not compile it.
  # Store and query own bulk IO. The `test` job does not set `RBITCOIN_IO`.
  pread:
    name: pread
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [qc, test]
    env:
      CARGO_TARGET_DIR: target/dev
      RBITCOIN_IO: pread
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/tmpfs-test-runner.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-pread
          workspaces: ". -> target/dev"
      - name: cargo test store and query
        run: cargo test -p rbitcoin-store -p rbitcoin-query

  # Forward rustc. Same wait as pread: a red `test` does not compile it.
  # Product MSRV stays rust-toolchain.toml. This job checks the dialect still
  # builds on the channel in rust-forward.toml, beside pread.
  rust-forward:
    name: rust-forward
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [qc, test]
    env:
      CARGO_TARGET_DIR: target/forward
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install forward toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-forward.toml)
          test -n "$channel"
          rustup toolchain install --profile minimal "$channel"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-rust-forward
          workspaces: ". -> target/forward"
      - name: cargo check
        run: cargo check --workspace --all-targets

  # Line-coverage 91% floor + CRAP --fail-above 30 (allowlist in .cargo-crap.toml).
  # Slow; waits for qc and test so a red check does not start
  # this job. Required. Job+step timeouts so a hung llvm-cov test binary
  # cannot sit until the runner's 6h default.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [qc, test]
    env:
      # coverage.sh also forces target/cov; set here so rust-cache keys match.
      CARGO_TARGET_DIR: target/cov
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/tmpfs-test-runner.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # rustup >= 1.30 no longer auto-installs for `rustup component`, so
      # install the rust-toolchain.toml toolchain first.
      - name: rustup llvm-tools-preview
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-coverage
          workspaces: ". -> target/cov"
      # Prebuilt binary — do not `cargo install` (compiles llvm-cov from crates.io).
      # Pin the action commit. Unpinned third-party tags are not immutable.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-crap@0.4.3
      - name: coverage (line gate)
        timeout-minutes: 15
        env:
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crap-report
          path: coverage/crap.json
          if-no-files-found: ignore
          retention-days: 5

  # Not a required check. Write token only on green master coverage.
  coverage-badge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the coverage badge.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: coverage
      - name: publish coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_COVERAGE_BADGE: "1"
        run: ./scripts/publish-coverage-badge.sh
