name: mutants
on:
  schedule:
    - cron: '0 3 * * 0'
  pull_request:
    paths: ['crates/rbitcoin-consensus/**']
permissions:
  contents: read
jobs:
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: '1.95' }
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.86.7
        with: { tool: cargo-mutants }
      - run: cargo mutants --in-diff origin/${{ github.base_ref }} -- --skip core --exclude-re '^(rbitcoin-node|rbitcoin-cli|bench)' -j 2
  mutants-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: '1.95' }
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.86.7
        with: { tool: cargo-mutants }
      - run: cargo mutants --shard ${{ matrix.shard }}/4 -- --skip core --exclude-re '^(rbitcoin-node|rbitcoin-cli|bench)' -j 2
