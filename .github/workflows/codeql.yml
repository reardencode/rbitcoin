# CodeQL code scanning — advanced setup (in-repo, reviewable).
#
# Free for public repositories (GitHub Actions + code scanning). Private repos
# need a plan that includes code scanning; enable Code scanning in
# Settings → Code security if alerts do not appear after the first run.
#
# Languages: Rust (workspace) + GitHub Actions workflows.
# Query suite: security-extended (default security + extra high-signal queries).
#
# Rust: CodeQL only supports build-mode `none` (not manual/autobuild). The
# extractor uses rust-analyzer + cargo for build scripts/macros; a full
# `cargo build` is not used. Runner needs rustup/cargo on PATH — pin matches
# ci.yml / Nix shell (1.95 class).
#
# https://docs.github.com/code-security/code-scanning
# https://docs.github.com/en/code-security/reference/code-scanning/codeql/build-options-for-compiled-languages#building-rust

name: codeql

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly full scan (catches issues that miss PR diffs); offset from top of hour.
    - cron: "23 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Required to upload SARIF and write code-scanning alerts
      security-events: write
      contents: read
      actions: read
      # Packs from GitHub Container Registry if used later
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust: only build-mode `none` is supported (CodeQL 2.x / GA).
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required before CodeQL init for Rust: extractor needs rustup + cargo.
      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended: default security suite + additional queries with
          # lower false-positive rate than the full quality pack.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
