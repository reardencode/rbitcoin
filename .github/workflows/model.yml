# Model-checked concurrency (`--test model`): loom explores script-pool claim
# order, the UTXO view stamp, and the Class C sequence counter. shuttle runs
# the script-pool idle turn. Not a required PR check. The engine is a
# `--cfg`, not a feature, so each job has its own target dir and cache. The
# nightly schedule raises the budget (TESTING.md) and seeds shuttle with the
# run id. The index-release order is not a model: it needs a Query full of
# std locks.
#
# rustc comes from rust-toolchain.toml (the nix-shell / crane baseline). The
# runner image's rustup auto-installs that toolchain and its components on
# first cargo.

name: model

on:
  pull_request:
  push:
    branches: [master, main, "v*.*.x"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  # Schedule has its own group. A push or workflow_dispatch on this ref
  # must not cancel the nightly deep run.
  group: model-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Actions only. rust-cache restores dep rlibs (not workspace crates) and
  # strips incremental artifacts before persist; it also sets this so rustc
  # does not write throwaway dep-graphs.
  CARGO_INCREMENTAL: "0"

jobs:
  model:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A loom failure and a shuttle failure are separate findings.
      fail-fast: false
      matrix:
        engine: [loom, shuttle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: model-${{ matrix.engine }}
          workspaces: ". -> target/model-${{ matrix.engine }}"
      - name: model-check ${{ matrix.engine }}
        if: github.event_name != 'schedule'
        run: ./scripts/model-check.sh ${{ matrix.engine }}
      - name: model-check ${{ matrix.engine }} (nightly deep budget)
        if: github.event_name == 'schedule'
        env:
          LOOM_MAX_PREEMPTIONS: "4"
          MODEL_SHUTTLE_ITERS: "50000"
          MODEL_SHUTTLE_DEPTH: "5"
          SHUTTLE_RANDOM_SEED: ${{ github.run_id }}
        run: ./scripts/model-check.sh ${{ matrix.engine }}
