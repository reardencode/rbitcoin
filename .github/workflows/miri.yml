# Nightly Miri for rbitcoin-primitives only (Q-53).
# Not a required PR check. Product rustc stays 1.95; this job uses nightly
# only to drive Miri. Never cargo miri test --workspace.
# Primitives includes scriptnum, pack-ints, and create.loc SIMD (Q-68).
#
# Operator may need to push this workflow file (GitHub App often cannot).

name: miri

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

concurrency:
  # Schedule has its own group. workflow_dispatch must not cancel the nightly run.
  group: miri-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  primitives:
    name: primitives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: rustup nightly + miri
        run: rustup toolchain install nightly --component miri --component rust-src --profile minimal --allow-downgrade --no-self-update

      - name: cargo miri test -p rbitcoin-primitives
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: ./scripts/miri.sh
