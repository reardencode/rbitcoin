# Nightly (~10 min) and weekly (~1h) libFuzzer. Not a required PR check.
# Product rustc stays 1.95; this job uses nightly only to drive cargo-fuzz.
#
# Single cron: Sunday uses fuzz-run.sh default 3600s; other days 600s.
# workflow_dispatch.inputs.duration overrides when set.

name: fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: libFuzzer -max_total_time seconds (leave empty for 600 / Sunday 3600)
        required: false
        default: ""

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.bin }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: "-A warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bin: block_wire, core: false }
          - { bin: v2_contents, core: false }
          - { bin: addrv2_wire, core: false }
          - { bin: inv_getdata_wire, core: false }
          - { bin: electrum_json, core: false }
          - { bin: store_reorg, core: false }
          - { bin: script_kernel_differential, core: false }
          - { bin: v2_session, core: true }
          - { bin: cmpct_differential, core: true }
          - { bin: block_differential, core: true }
          - { bin: block_spend_differential, core: true }
          - { bin: script_differential, core: true }
          - { bin: block_fork_differential, core: true }
          - { bin: cmpct_reorg_differential, core: true }
          - { bin: block_reorg_n_differential, core: true }
          - { bin: block_csv_differential, core: true }
          - { bin: mempool_differential, core: true }
          - { bin: script_verify_differential, core: true }
          - { bin: p2p_sequence_differential, core: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          components: rust-src

      - name: clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-fuzz@0.13.2

      - if: matrix.core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rbitcoin/core-bitcoind
          key: core-bitcoind-v31.1-${{ runner.os }}-${{ runner.arch }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-${{ matrix.bin }}
          workspaces: "fuzz -> fuzz/target"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.bin }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.bin }}-

      - name: cargo fuzz run ${{ matrix.bin }}
        env:
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.duration }}
        run: ./scripts/fuzz-run.sh ${{ matrix.bin }}

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.bin }}
          path: fuzz/crashers/
          if-no-files-found: ignore
