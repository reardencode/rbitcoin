# Nightly (~10 min) and weekly (~1h) libFuzzer. Not a required PR check.
# Product rustc stays 1.95; this job uses nightly only to drive cargo-fuzz.
#
# Operator must push this workflow file (GitHub App cannot).

name: fuzz

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: libFuzzer -max_total_time seconds (600 nightly, 3600 weekly)
        required: false
        default: "600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block_wire:
    name: block_wire
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: nightly
          components: rust-src

      - name: clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      # Prebuilt cargo-fuzz — do not cargo install (compiles from crates.io
      # inside the 20-min job timeout). Pin Action commit (CodeQL).
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz@0.13.2

      # rust-toolchain.toml is 1.95; cargo-fuzz needs nightly -Zsanitizer.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ github.job }}-

      - name: cargo fuzz run block_wire
        env:
          RUSTUP_TOOLCHAIN: nightly
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.duration || (github.event.schedule == '17 7 * * 0' && '3600' || '600') }}
        run: ./scripts/fuzz-run.sh

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.2
        with:
          name: fuzz-crashers-${{ github.job }}
          path: fuzz/crashers/
          if-no-files-found: ignore

  v2_contents:
    name: v2_contents
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
