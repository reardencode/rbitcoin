# Nightly libFuzzer for consensus block wire (Q-30 minimum).
# Not a required PR check. Product rustc stays 1.95; this job uses nightly
# only to drive cargo-fuzz.
#
# Operator may need to push this workflow file (GitHub App often cannot).

name: fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block_wire:
    name: block_wire
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: nightly
          components: rust-src

      - name: clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      # Prebuilt cargo-fuzz — do not cargo install (compiles from crates.io
      # inside the 20-min job timeout). Pin Action commit (CodeQL).
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz@0.13.2

      # rust-toolchain.toml is 1.95; cargo-fuzz needs nightly -Zsanitizer.
      - name: cargo fuzz run block_wire
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: ./scripts/fuzz-run.sh

  block_differential:
    name: block_differential
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: "-A warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: nightly
          components: rust-src

      - name: clang (libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz@0.13.2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/rbitcoin/core-bitcoind
          key: core-bitcoind-v31.1-${{ runner.os }}-${{ runner.arch }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-block-differential
          workspaces: "fuzz -> fuzz/target"

      - name: cargo fuzz run block_differential
        env:
          FUZZ_MAX_TOTAL_TIME: "600"
        run: ./scripts/fuzz-run.sh block_differential
