# Core functional: nightly + dispatch + label `core-functional`.
# Ship PRs and label `release` run it through release-gate.yml
# (workflow_call, `gate: true`) so `release-extra` can require it.
# Default cargo test never calls nightly.sh.
name: core-functional

on:
  schedule:
    # Off the hour so we do not pile onto the public Actions stampede.
    - cron: "27 6 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  # Schedule has its own group. workflow_dispatch on the default branch
  # must not cancel the nightly run. Label and ship-gate runs stay on the
  # pull-request number.
  group: core-functional-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ inputs.gate && 'gate-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-functional:
    name: core-functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      inputs.gate ||
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'core-functional')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly (inventory + Core-release warn + run set)
        run: ./scripts/core-functional/nightly.sh
