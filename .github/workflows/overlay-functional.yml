# Overlay functional: nightly + dispatch + label `overlay-functional`.
# Ship PRs and label `release` run it through release-gate.yml
# (workflow_call, `gate: true`) so `release-extra` can require it.
# Default cargo test never calls run.sh.
name: overlay-functional

on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  # Schedule has its own group. workflow_dispatch on the default branch
  # must not cancel the nightly run. Label and ship-gate runs stay on the
  # pull-request number.
  group: overlay-functional-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ inputs.gate && 'gate-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay-functional:
    name: overlay-functional
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      inputs.gate ||
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'overlay-functional')
    env:
      CARGO_TARGET_DIR: target/dev
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: overlay-functional-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: overlay-functional-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: overlay-functional
          workspaces: ". -> target/dev"
      - name: TUN
        run: sudo modprobe tun
      - name: overlay journeys
        run: nix develop .#overlayFunctional --command ./scripts/overlay-functional/run.sh
