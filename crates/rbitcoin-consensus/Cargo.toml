[package]
name = "rbitcoin-consensus"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Block and transaction validation / confirmability"

[lib]
test = false
doctest = false

[features]
# The suite links the assembler (`core_script`). Product crates depend on
# this package with `default-features = false`, so a node build leaves it off.
default = ["corpus"]
# Lets script-oracle call the Core script assembler. Off for the node.
corpus = ["dep:serde_json"]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]
# Pure consensus proof entry. Off for the node build.
equiv = []


[dependencies]
rbitcoin-primitives = { workspace = true }
arc-swap = { workspace = true }
bitcoin = { workspace = true }
bitcoin_hashes = { workspace = true }
# Corpus rows are JSON. The node build leaves this feature off.
serde_json = { workspace = true, optional = true }
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }
# Parallel script checks use in-crate `script_pool` (std threads) — no rayon.

[dev-dependencies]
serde_json = { workspace = true }
# Test-only zstd decode for Floresta historical block packs (not on the node graph).
ruzstd = "0.9"

[[test]]
name = "suite"
path = "tests/suite.rs"
required-features = ["corpus"]

[[test]]
name = "model"
path = "tests/model/main.rs"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(shuttle)'.dependencies]
shuttle = "0.9"

[lints]
workspace = true
