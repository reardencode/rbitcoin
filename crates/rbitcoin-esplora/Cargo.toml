[package]
name = "rbitcoin-esplora"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Esplora-compatible REST (electrs HTTP drop-in except address-prefix)"

[lib]
test = false
doctest = false

[features]
mutants = []


[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-electrum = { workspace = true }
rbitcoin-net = { workspace = true }
rbitcoin-consensus = { workspace = true }
bitcoin = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
