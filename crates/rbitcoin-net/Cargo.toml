[package]
name = "rbitcoin-net"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Bitcoin P2P (BIP324, tip follow, compact v2, tx relay)"

[lib]
test = false
doctest = false

[features]
mutants = []


[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-mempool = { workspace = true }
bitcoin = { workspace = true }
bip324 = { workspace = true }
tokio = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }
getrandom = "0.4"
sha3 = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
# POLLRDHUP: peer FIN with unread bytes still in the receive buffer.
libc = "0.2"

[dev-dependencies]
rbitcoin-ibd = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# tests/i2p_sam.rs: SO_LINGER 0 resets the fake SAM socket.
libc = "0.2"

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
