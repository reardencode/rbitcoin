[package]
name = "rbitcoin-primitives"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Shared types for the rbitcoin node"

[lib]
test = false
doctest = false

[features]
mutants = []


[dependencies]
bitcoin_hashes = { workspace = true }
# Same crate `bitcoin::hex` re-exports. Not the `bitcoin` crate: store depends
# on primitives and stays hashes-only.
hex-conservative = { version = "1.1.0", default-features = false, features = ["alloc"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
