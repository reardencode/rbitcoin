[package]
name = "rbitcoin-query"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Query API over the rbitcoin store"

[lib]
doctest = false
test = false

[dependencies]
rbitcoin-consensus = { workspace = true }
rbitcoin-primitives = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-log = { workspace = true }
tokio = { workspace = true }
bitcoin = { workspace = true }
arc-swap = { workspace = true }
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }

[features]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
