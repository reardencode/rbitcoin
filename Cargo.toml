[workspace]
resolver = "2"
members = [
    "crates/rbitcoin-primitives",
    "crates/rbitcoin-log",
    "crates/rbitcoin-store",
    "crates/rbitcoin-query",
    "crates/rbitcoin-wire-cache",
    "crates/rbitcoin-consensus",
    "crates/rbitcoin-mempool",
    "crates/rbitcoin-net",
    "crates/rbitcoin-rpc",
    "crates/rbitcoin-electrum",
    "crates/rbitcoin-esplora",
    "crates/rbitcoin-cli",
    "crates/rbitcoin-node",
    "crates/rbitcoin-test",
]
default-members = ["crates/rbitcoin-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reardencode/rbitcoin"
rust-version = "1.74"

[workspace.dependencies]
rbitcoin-primitives = { path = "crates/rbitcoin-primitives" }
rbitcoin-log = { path = "crates/rbitcoin-log" }
rbitcoin-store = { path = "crates/rbitcoin-store" }
rbitcoin-query = { path = "crates/rbitcoin-query" }
rbitcoin-wire-cache = { path = "crates/rbitcoin-wire-cache" }
rbitcoin-consensus = { path = "crates/rbitcoin-consensus" }
rbitcoin-mempool = { path = "crates/rbitcoin-mempool" }
rbitcoin-net = { path = "crates/rbitcoin-net" }
rbitcoin-rpc = { path = "crates/rbitcoin-rpc" }
rbitcoin-electrum = { path = "crates/rbitcoin-electrum" }
rbitcoin-esplora = { path = "crates/rbitcoin-esplora" }
rbitcoin-cli = { path = "crates/rbitcoin-cli" }
rbitcoin-node = { path = "crates/rbitcoin-node" }
rbitcoin-test = { path = "crates/rbitcoin-test" }

# JSON for Electrum (and tests). No other serde derives in core crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Esplora REST + wallet WebSocket live updates.
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
# rust-bitcoin stack
# No `bitcoinconsensus` feature — we verify scripts in pure Rust (see rbitcoin-consensus::script).
bitcoin = { version = "0.32.101", default-features = true }
bitcoin_hashes = "0.14.101"
# BIP324 v2 encrypted P2P transport (tokio async ProtocolReader/Writer).
bip324 = { version = "0.11", default-features = true, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "rt", "signal", "fs"] }
# Lock-free Arc publish for immutable pin outs/layout halves
arc-swap = "1"
# Process-wide heap for product binaries (musl static + glibc). Replaces the
# platform default (musl/glibc malloc) via #[global_allocator] in each bin.
mimalloc = "0.1"

# Fail the build on rustc warnings (unused imports, dead code, …).
[workspace.lints.rust]
warnings = "deny"
# cargo-llvm-cov sets `cfg(coverage)` so diagnostic microbenches can use
# `#[cfg(not(coverage))]` and stay out of the first-party LCOV denominator.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)'] }

# Clippy: CI runs `clippy … -- -D warnings`. Correctness/suspicious stay on (default
# deny via clippy). Allow style/complexity noise that would otherwise require
# drive-by refactors across store/query hot paths. Prefer fixing real bugs over
# expanding this list without cause.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Common style under -D warnings (stable clippy); not correctness.
unnecessary_cast = "allow"
redundant_closure = "allow"
redundant_locals = "allow"
drop_non_drop = "allow"
assertions_on_constants = "allow"
nonminimal_bool = "allow"
eq_op = "allow"
comparison_chain = "allow"
redundant_pattern_matching = "allow"
unnecessary_mut_passed = "allow"
manual_clamp = "allow"
missing_const_for_thread_local = "allow"
useless_vec = "allow"
bool_assert_comparison = "allow"
int_plus_one = "allow"
collapsible_if = "allow"
needless_return = "allow"
map_entry = "allow"
let_unit_value = "allow"
needless_range_loop = "allow"
identity_op = "allow"
explicit_auto_deref = "allow"
manual_range_contains = "allow"
overly_complex_bool_expr = "allow"
len_zero = "allow"
items_after_test_module = "allow"
unnecessary_get_then_check = "allow"
same_item_push = "allow"
manual_pattern_char_comparison = "allow"
needless_question_mark = "allow"
useless_conversion = "allow"
new_without_default = "allow"
reserve_after_initialization = "allow"
needless_borrows_for_generic_args = "allow"
const_is_empty = "allow"
needless_update = "allow"
for_kv_map = "allow"
incompatible_msrv = "allow"
result_large_err = "allow"
duplicated_attributes = "allow"
err_expect = "allow"
# Large match/pipeline helpers and benches trip these without benefit.
format_collect = "allow"
if_same_then_else = "allow"
while_let_loop = "allow"
match_like_matches_macro = "allow"
explicit_counter_loop = "allow"
question_mark = "allow"
double_comparisons = "allow"
absurd_extreme_comparisons = "allow"
clone_on_copy = "allow"
field_reassign_with_default = "allow"
bool_comparison = "allow"
doc_lazy_continuation = "allow"
# rustc/clippy 1.95 (nixos-26.05) style noise — allow rather than drive-by refactors.
manual_checked_ops = "allow"
collapsible_match = "allow"
empty_line_after_doc_comments = "allow"
unnecessary_sort_by = "allow"
cloned_ref_to_slice_refs = "allow"
io_other_error = "allow"
manual_contains = "allow"
manual_div_ceil = "allow"
unnecessary_lazy_evaluations = "allow"
cognitive_complexity = "allow"
large_enum_variant = "allow"
