[package]
name = "rbitcoin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rbitcoin-consensus = { path = "../crates/rbitcoin-consensus" }
rbitcoin-net = { path = "../crates/rbitcoin-net" }
rbitcoin-query = { path = "../crates/rbitcoin-query" }

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "block_wire"
path = "fuzz_targets/block_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_differential"
path = "fuzz_targets/block_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_spend_differential"
path = "fuzz_targets/block_spend_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_fork_differential"
path = "fuzz_targets/block_fork_differential.rs"
test = false
doc = false
bench = false
