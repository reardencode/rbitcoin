[package]
name = "rbitcoin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rbitcoin-consensus = { path = "../crates/rbitcoin-consensus" }
rbitcoin-net = { path = "../crates/rbitcoin-net" }
rbitcoin-query = { path = "../crates/rbitcoin-query" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "block_wire"
path = "fuzz_targets/block_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_differential"
path = "fuzz_targets/block_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_spend_differential"
path = "fuzz_targets/block_spend_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_fork_differential"
path = "fuzz_targets/block_fork_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_contents"
path = "fuzz_targets/v2_contents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_session"
path = "fuzz_targets/v2_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmpct_differential"
path = "fuzz_targets/cmpct_differential.rs"
test = false
doc = false
bench = false
